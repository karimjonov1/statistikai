<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title if title else 'UTM Shortener' }}</title>
  <link rel="icon" href="/static/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="border-b bg-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between p-4">
      <a class="font-semibold" href="/">UTM Shortener</a>
      <nav class="text-sm text-slate-600">
        <a href="/" class="hover:text-slate-900">Home</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t text-center text-xs text-slate-500 py-6">Made with FastAPI · MIT</footer>
</body>
</html>
